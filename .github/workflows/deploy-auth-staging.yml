name: Deploy isolated Face ID test Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/feature/bbva-passkey-security'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: feature/bbva-passkey-security

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Run security checks
        working-directory: worker
        run: npm test

      - name: Deploy isolated staging Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config wrangler.faceid-test.jsonc
