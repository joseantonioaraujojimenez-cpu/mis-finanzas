name: Deploy isolated Face ID test Worker

on:
  workflow_dispatch:
    inputs:
      banking_activation:
        description: 'Read-only BBVA access: change only with explicit owner authorization'
        type: choice
        required: true
        default: unchanged
        options:
          - unchanged
          - enable-read-only
          - disable-read-only

permissions:
  contents: read

concurrency:
  group: mis-finanzas-faceid-test-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/feature/bbva-passkey-security'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Run security checks
        working-directory: worker
        run: npm test

      - name: Verify isolated deployment target
        working-directory: worker
        run: node -e 'const c=JSON.parse(require("node:fs").readFileSync("wrangler.faceid-test.jsonc")); if(c.name!=="mis-finanzas-faceid-test" || c.vars?.FACEID_TEST_MODE!=="enabled") process.exit(1)'

      - name: Deploy isolated staging Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_FACEID_TEST_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BANKING_ACTIVATION: ${{ inputs.banking_activation }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          args=()
          case "$BANKING_ACTIVATION" in
            unchanged|'') ;;
            enable-read-only|disable-read-only)
              flags=$(mktemp)
              trap 'rm -f "$flags"' EXIT
              if [ "$BANKING_ACTIVATION" = enable-read-only ]; then
                printf '%s\n' '{"ENABLE_REAL_AIS":"explicitly-authorized","ENABLE_PRODUCTION_RESTRICTED":"confirmed"}' > "$flags"
              else
                printf '%s\n' '{"ENABLE_REAL_AIS":"disabled","ENABLE_PRODUCTION_RESTRICTED":"unconfirmed"}' > "$flags"
              fi
              args+=(--secrets-file "$flags")
              ;;
            *) exit 1 ;;
          esac
          npx wrangler deploy --config wrangler.faceid-test.jsonc "${args[@]}"
