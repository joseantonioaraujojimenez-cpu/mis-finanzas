name: Worker security checks
on:
  push:
    branches: [feature/bbva-passkey-security]
  pull_request:
    paths:
      - 'worker/**'
      - 'passkey-test.html'
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Run security checks
        working-directory: worker
        run: npm test
      - name: Build Worker (no deployment)
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir /tmp/mis-finanzas-worker-build
      - name: Smoke test local Worker (no banking access)
        working-directory: worker
        run: |
          npx wrangler dev --local --port 8787 > /tmp/mis-finanzas-wrangler.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/ >/tmp/mis-finanzas-root.json; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then cat /tmp/mis-finanzas-wrangler.log; exit 1; fi
          grep -q '"bank_connected":false' /tmp/mis-finanzas-root.json
          STATUS=$(curl -s -o /tmp/mis-finanzas-auth.json -w '%{http_code}' \
            -H 'Origin: https://joseantonioaraujojimenez-cpu.github.io' \
            -H 'Content-Type: application/json' \
            -d '{}' http://127.0.0.1:8787/auth/login/options)
          test "$STATUS" = "503"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/transactions)
          test "$STATUS" = "404"
          # Untrusted origins must not reach authentication.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Origin: https://example.org' \
            -H 'Content-Type: application/json' \
            -d '{}' http://127.0.0.1:8787/auth/status)
          test "$STATUS" = "403"
          # Requests must declare JSON; rejected even when auth is disabled.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Origin: https://joseantonioaraujojimenez-cpu.github.io' \
            -H 'Content-Type: text/plain' \
            -d '{}' http://127.0.0.1:8787/auth/status)
          test "$STATUS" = "415"
          # Logout with no active token is safe and idempotent.
          STATUS=$(curl -s -o /tmp/mis-finanzas-logout.json -w '%{http_code}' \
            -H 'Origin: https://joseantonioaraujojimenez-cpu.github.io' \
            -H 'Content-Type: application/json' \
            -d '{}' http://127.0.0.1:8787/auth/logout)
          test "$STATUS" = "200"
          grep -q '"loggedOut":true' /tmp/mis-finanzas-logout.json
          # An unknown token must not authenticate.
          STATUS=$(curl -s -o /tmp/mis-finanzas-status.json -w '%{http_code}' \
            -H 'Origin: https://joseantonioaraujojimenez-cpu.github.io' \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer invalid-test-token' \
            -d '{}' http://127.0.0.1:8787/auth/status)
          test "$STATUS" = "200"
          grep -q '"authenticated":false' /tmp/mis-finanzas-status.json
